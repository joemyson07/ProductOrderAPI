version: "3.8"

services:  
  mysql_knex:
    container_name: mysql_knex
    hostname: mysql_knex
    image: mysql:8.0
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:  
      - ~/.MySQLDBData/mysqlonly/mysql_knex_v2:/var/lib/mysql
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_ASSWORD: senha
      MYSQL_DATABASE: CARRINHO_DB
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      TZ: America/Sao_Paulo